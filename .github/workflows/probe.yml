name: Probe results sites

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pages
        run: |
          mkdir -p probe
          curl -sSL -A "Mozilla/5.0" -o probe/state-home.html https://nyenr.elections.ny.gov/Home.aspx
          curl -sSL -A "Mozilla/5.0" -o probe/state-nojs.html https://nyenr.elections.ny.gov/HomeNoJS.aspx
          curl -sSL -A "Mozilla/5.0" -o probe/erie.html "https://erie.resultscaster.com/feed.aspx?usersessionid=none"
          ls -l probe

      - name: Save to repository
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add probe
          git commit -m "Save probe pages" || echo "Nothing new to save"
          git push
